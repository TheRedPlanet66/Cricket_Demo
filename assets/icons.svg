<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <!-- Cricket Ball Icon -->
    <symbol id="cricket-ball" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="14" fill="#B30000" stroke="#8B0000" stroke-width="2"/>
        <path d="M 8 10 Q 16 12 24 10" stroke="#8B0000" stroke-width="2" fill="none"/>
        <path d="M 8 22 Q 16 20 24 22" stroke="#8B0000" stroke-width="2" fill="none"/>
        <circle cx="16" cy="16" r="2" fill="#8B0000"/>
    </symbol>
    
    <!-- Close Icon -->
    <symbol id="close" viewBox="0 0 24 24">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    
    <!-- Twitter Icon -->
    <symbol id="twitter" viewBox="0 0 24 24">
        <path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z" fill="currentColor"/>
    </symbol>
    
    <!-- Instagram Icon -->
    <symbol id="instagram" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/>
    </symbol>
    
    <!-- Facebook Icon -->
    <symbol id="facebook" viewBox="0 0 24 24">
        <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z" fill="currentColor"/>
    </symbol>
    
    <!-- Cricket Bat Icon -->
    <symbol id="cricket-bat" viewBox="0 0 24 24">
        <path d="M3.5 20.5L8 16L16 8L20.5 3.5C21.328 2.672 21.328 1.328 20.5 0.5C19.672 -0.328 18.328 -0.328 17.5 0.5L13 5L5 13L0.5 17.5C-0.328 18.328 -0.328 19.672 0.5 20.5C1.328 21.328 2.672 21.328 3.5 20.5Z" fill="currentColor"/>
        <rect x="7" y="15" width="2" height="6" rx="1" transform="rotate(-45 8 18)" fill="currentColor"/>
    </symbol>
    
    <!-- Cricket Stumps Icon -->
    <symbol id="cricket-stumps" viewBox="0 0 24 24">
        <rect x="4" y="4" width="2" height="16" fill="currentColor"/>
        <rect x="11" y="4" width="2" height="16" fill="currentColor"/>
        <rect x="18" y="4" width="2" height="16" fill="currentColor"/>
        <rect x="3" y="3" width="18" height="2" fill="currentColor"/>
        <rect x="3" y="19" width="18" height="2" fill="currentColor"/>
    </symbol>
    
    <!-- Menu/Hamburger Icon -->
    <symbol id="menu" viewBox="0 0 24 24">
        <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    
    <!-- Arrow Right Icon -->
    <symbol id="arrow-right" viewBox="0 0 24 24">
        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    
    <!-- Check Icon -->
    <symbol id="check" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
</svg>
